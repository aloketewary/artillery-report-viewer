<input type="file" class="file-input" [accept]="requiredFileType" (change)="onFileSelected($event)" #fileUpload>

<div class="upload-control">
  <span class="upload-name">{{fileName || 'Upload report JSON'}}</span>
  @if (!isFileUpload) {
    <button tuiButton type="button" size="s" appearance="accent" (click)="fileUpload.click()">
      Choose file
    </button>
  }
  @if (isFileUpload) {
    <button tuiButton type="button" size="s" appearance="secondary" (click)="reset()">
      Clear
    </button>
  }
</div>

@if (uploadProgress !== null) {
  <progress class="upload-progress" max="100" [value]="uploadProgress" aria-label="Upload progress"></progress>
  <button tuiButton type="button" size="xs" appearance="secondary" (click)="cancelUpload()">
    Cancel upload
  </button>
}
