<div class="chart-grid">
  <section class="arv-panel" aria-labelledby="http-code-time-title">
    <header class="arv-panel-header">
      <h2 id="http-code-time-title">HTTP codes over time</h2>
    </header>
    <div class="arv-divider"></div>
    @if (isDataAvailable) {
      <div echarts [options]="options2" [theme]="isDarkMode ? 'dark' : ''" class="chart" role="img" aria-label="HTTP response code time series"></div>
    } @else {
      <div class="arv-empty">No time-series results to display.</div>
    }
  </section>
  <section class="arv-panel" aria-labelledby="http-code-summary-title">
    <header class="arv-panel-header">
      <h2 id="http-code-summary-title">Response codes</h2>
    </header>
    <div class="arv-divider"></div>
    @if (isDataAvailable) {
      <div echarts [options]="options" [theme]="isDarkMode ? 'dark' : ''" class="chart" role="img" aria-label="HTTP response code distribution"></div>
    } @else {
      <div class="arv-empty">No aggregate results to display.</div>
    }
  </section>
</div>
