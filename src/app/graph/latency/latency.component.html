<div class="card-container">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Latency Over Time</mat-card-title>
      <!-- <mat-card-subtitle>subtitle</mat-card-subtitle> -->
    </mat-card-header>
    <mat-card-content>
      <mat-divider class="margin-10-tb">
      </mat-divider>
      @if (isDataAvailable) {
        <div echarts [options]="options" [theme]="isDarkMode ? 'dark': ''" class="chart"></div>
      }
      @if (!isDataAvailable) {
        <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="0px" class="flex-full">
          <div class="mat-subtitle-1">No results to display!</div>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
