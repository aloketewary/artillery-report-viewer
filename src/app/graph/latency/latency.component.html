<section class="arv-panel" aria-labelledby="latency-chart-title">
  <header class="arv-panel-header">
    <h2 id="latency-chart-title">Latency over time</h2>
  </header>
  <div class="arv-divider"></div>
  @if (isDataAvailable) {
    <div echarts [options]="options" [theme]="isDarkMode ? 'dark' : ''" class="chart" role="img" aria-label="Latency percentile chart"></div>
  } @else {
    <div class="arv-empty">No time-series results to display.</div>
  }
</section>
