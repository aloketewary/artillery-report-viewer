<section class="arv-panel" aria-labelledby="request-load-chart-title">
  <header class="arv-panel-header">
    <h2 id="request-load-chart-title">Requests and response counts over time</h2>
    <label class="code-filter">
      <span>Response code groups</span>
      <select class="code-select" multiple [formControl]="selectedHttpCodes" aria-label="Filter response code groups">
        @for (code of httpCodeLists; track code) {
          <option [value]="code">{{code}}</option>
        }
      </select>
    </label>
  </header>
  <div class="arv-divider"></div>
  @if (isDataAvailable) {
    <div echarts [options]="options" [theme]="isDarkMode ? 'dark' : ''" class="chart" role="img" aria-label="Request load chart"></div>
  } @else {
    <div class="arv-empty">No time-series results to display.</div>
  }
</section>
