<div class="global-actions" role="group" aria-label="Global actions">
  @if (canExport) {
    <button
      tuiButton
      type="button"
      size="s"
      appearance="floating"
      aria-label="Download HTML report"
      title="Download HTML report"
      (click)="exportReport()">
      HTML
    </button>
    <button
      tuiButton
      type="button"
      size="s"
      appearance="floating"
      aria-label="Download original JSON"
      title="Download original JSON"
      (click)="downloadJson()">
      JSON
    </button>
    <button
      tuiButton
      type="button"
      size="s"
      appearance="floating"
      aria-label="Print report or save as PDF"
      title="Print report or save as PDF"
      (click)="printReport()">
      PDF
    </button>
  }
  @if (canReset) {
    <button
      tuiIconButton
      type="button"
      size="s"
      appearance="floating"
      aria-label="Analyze another report"
      title="Analyze another report"
      (click)="resetReport()">
      <tui-icon class="action-icon" [icon]="'@tui.refresh-cw'" aria-hidden="true"></tui-icon>
      <span class="visually-hidden">Analyze another report</span>
    </button>
  }
  <button
    tuiIconButton
    type="button"
    size="s"
    appearance="icon"
    [attr.aria-pressed]="theme === 'dark'"
    [attr.aria-label]="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="toggleTheme()">
    <tui-icon
      class="theme-icon"
      [icon]="theme === 'dark' ? '@tui.sun' : '@tui.moon'"
      aria-hidden="true"></tui-icon>
  </button>
</div>
