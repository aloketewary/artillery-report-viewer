<div class="global-actions" role="group" aria-label="Global actions">
  @if (canExport) {
    <button
      tuiIconButton
      type="button"
      size="s"
      appearance="floating"
      aria-label="Export current report"
      title="Export current report"
      (click)="exportReport()">
      <tui-icon class="action-icon" [icon]="'@tui.download'" aria-hidden="true"></tui-icon>
      <span class="visually-hidden">Export report</span>
    </button>
  }
  @if (canReset) {
    <button
      tuiIconButton
      type="button"
      size="s"
      appearance="floating"
      aria-label="Reset current report"
      title="Reset current report"
      (click)="resetReport()">
      <tui-icon class="action-icon" [icon]="'@tui.refresh-cw'" aria-hidden="true"></tui-icon>
      <span class="visually-hidden">Reset report</span>
    </button>
  }
  <button
    tuiIconButton
    type="button"
    size="s"
    appearance="icon"
    [attr.aria-pressed]="theme === 'dark'"
    [attr.aria-label]="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="toggleTheme()">
    <tui-icon
      class="theme-icon"
      [icon]="theme === 'dark' ? '@tui.sun' : '@tui.moon'"
      aria-hidden="true"></tui-icon>
  </button>
</div>
