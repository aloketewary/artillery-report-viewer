@if (isLoaded) {
  <section class="arv-panel" aria-labelledby="info-title">
    <header class="arv-panel-header">
      <h2 id="info-title">Report information</h2>
      <button tuiButton type="button" size="s" appearance="accent" (click)="downloadJson()">Download JSON</button>
    </header>
    <div class="arv-divider"></div>
    <dl class="info-grid">
      <div>
        <dt>Name</dt>
        <dd>{{reportStat?.name}}</dd>
      </div>
      <div>
        <dt>Format version</dt>
        <dd>{{reportStat?.version}}</dd>
      </div>
      <div>
        <dt>Custom metrics</dt>
        <dd>{{hasCustomMetrics ? 'Yes' : 'No'}}</dd>
      </div>
    </dl>
  </section>
}
